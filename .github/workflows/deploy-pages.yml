name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and tests
        run: npm run check

      - name: Check Cesium Ion token
        run: test -n "${{ secrets.CESIUM_ION_TOKEN }}"

      - name: Build static site
        env:
          # 项目站点默认 /<仓库名>/；用户/组织站点或自定义域名可通过 PAGES_BASE_PATH=/ 覆盖。
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || (endsWith(github.repository, '.github.io') && '/' || format('/{0}/', github.event.repository.name)) }}
          VITE_STATIC_HOST: '1'
          # 静态页面由浏览器直连 Cesium Ion；不要在 workflow 中写死 token。
          VITE_CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
