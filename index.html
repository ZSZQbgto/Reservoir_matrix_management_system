<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070b" />
    <meta
      name="description"
      content="Tellux 三维地球 · Cesium World Terrain · Cesium / ArcGIS 影像 · 基于浅水方程的水体编辑器"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tellux Earth · Cesium 地形 · 水体编辑</title>
  </head>
  <body data-mode="scene">
    <div id="viewer" aria-label="三维地球视口"></div>

    <div class="atmosphere-vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="app-shell">
      <header class="hud hud-top">
        <a class="brand" href="/" aria-label="Tellux Earth 首页">
          <span class="brand-orbit" aria-hidden="true">
            <span></span>
          </span>
          <span class="brand-copy">
            <strong>TELLUX <em>EARTH</em></strong>
          </span>
        </a>

        <nav class="mode-dock" id="mode-dock" aria-label="编辑模式">
          <span class="mode-glider" id="mode-glider" aria-hidden="true"></span>
          <button type="button" class="mode-button is-active" id="mode-scene" data-mode="scene" aria-pressed="true">
            <span class="mode-glyph" aria-hidden="true"></span>浏览
          </button>
          <button type="button" class="mode-button" id="mode-water" data-mode="water" aria-pressed="false">
            <span class="mode-glyph" aria-hidden="true"></span>水体编辑
          </button>
        </nav>

        <div class="status-strip" role="status" aria-live="polite">
          <span class="status-pill" id="terrain-status" data-tone="ok">
            <i></i><b>地形</b><span>本地</span>
          </span>
          <span class="status-pill" id="water-status-pill" data-tone="warn">
            <i></i><b>水体</b><span>未启用</span>
          </span>
          <span class="status-pill" id="cloud-status">
            <i></i><b>体积云</b><span>已关闭</span>
          </span>
          <span class="status-pill" id="clock-status">
            <i></i><b>时间</b><span>—</span>
          </span>
        </div>
      </header>

      <main class="stage" id="stage">
        <aside class="water-panel water-panel-left" id="water-left" aria-label="水源列表" hidden>
          <div class="panel-head">
            <span>水体模拟</span>
          </div>
          <div class="panel-body">
            <div class="water-actions">
              <button type="button" class="primary-button" id="water-add-source">＋ 水源</button>
              <button type="button" class="ghost-button" id="water-clear-sources">清空</button>
            </div>

            <div class="water-progress" id="water-progress" hidden>
              <div class="water-progress-track"><span id="water-progress-bar"></span></div>
              <small id="water-progress-label">正在采样地形…</small>
            </div>

            <div class="water-source-list" id="water-source-list" role="list"></div>

            <div class="water-domain-card">
              <div class="water-domain-row">
                <span>固定模拟区</span>
                <b>8 km × 8 km</b>
              </div>
              <p class="water-domain-meta" id="water-domain-meta">116.77000°, 36.02000°（尚未建立）</p>
              <button type="button" class="ghost-button wide" id="water-rebuild-domain">
                重建模拟域
              </button>
            </div>
          </div>
        </aside>

        <div class="stage-center" aria-hidden="true"></div>

        <div class="stage-right">
          <aside class="console" id="console" aria-label="场景控制台">
            <button class="console-toggle" id="console-toggle" type="button" aria-expanded="true" aria-controls="console-body">
              <span>场景控制</span>
              <span class="console-toggle-side">
                <span class="chevron" aria-hidden="true"></span>
              </span>
            </button>

            <div class="console-body" id="console-body">
              <section class="control-section">
                <div class="section-head">
                  <span>体积云</span>
                </div>

                <label class="switch-row">
                  <span>云层开关</span>
                  <input type="checkbox" id="clouds-toggle" />
                  <span class="switch" aria-hidden="true"></span>
                </label>

                <label class="range-row" for="coverage">
                  <span>云量 <output id="coverage-value">30%</output></span>
                  <input id="coverage" type="range" min="0" max="100" value="30" />
                </label>

                <label class="range-row" for="cloud-altitude">
                  <span>云底高度 <output id="cloud-altitude-value">9000 m</output></span>
                  <input id="cloud-altitude" type="range" min="800" max="16000" step="100" value="9000" />
                </label>

                <label class="range-row" for="cloud-height">
                  <span>云层厚度 <output id="cloud-height-value">800 m</output></span>
                  <input id="cloud-height" type="range" min="120" max="4000" step="20" value="800" />
                </label>

                <label class="range-row" for="cloud-speed">
                  <span>流动速度 <output id="cloud-speed-value">1.0×</output></span>
                  <input id="cloud-speed" type="range" min="0" max="8" step="0.1" value="1" />
                </label>

                <label class="range-row" for="quality">
                  <span>渲染质量 <output id="quality-value">高</output></span>
                  <input id="quality" type="range" min="0" max="3" step="1" value="2" />
                </label>
              </section>

              <section class="control-section">
                <div class="section-head">
                  <span>云层细节</span>
                </div>

                <label class="switch-row">
                  <span>云形细节</span>
                  <input type="checkbox" id="cloud-detail" checked />
                  <span class="switch" aria-hidden="true"></span>
                </label>

                <label class="switch-row">
                  <span>湍流扰动</span>
                  <input type="checkbox" id="cloud-turbulence" checked />
                  <span class="switch" aria-hidden="true"></span>
                </label>

                <label class="switch-row">
                  <span>薄雾质感</span>
                  <input type="checkbox" id="cloud-haze" checked />
                  <span class="switch" aria-hidden="true"></span>
                </label>

                <label class="switch-row">
                  <span>体积光柱</span>
                  <input type="checkbox" id="cloud-light-shafts" checked />
                  <span class="switch" aria-hidden="true"></span>
                </label>

                <label class="range-row" for="cloud-shadow-quality">
                  <span>云影质量 <output id="cloud-shadow-quality-value">中</output></span>
                  <input id="cloud-shadow-quality" type="range" min="0" max="2" step="1" value="1" />
                </label>
              </section>

              <section class="control-section" id="cloud-tuning" hidden>
                <div class="section-head">
                  <span>云体与性能</span>
                </div>

                <label class="range-row" for="cloud-min-step">
                  <span>最小步长 <output id="cloud-min-step-value">60</output></span>
                  <input id="cloud-min-step" type="range" min="30" max="150" step="5" value="60" />
                </label>

                <label class="range-row" for="cloud-iterations">
                  <span>主步进上限 <output id="cloud-iterations-value">400</output></span>
                  <input id="cloud-iterations" type="range" min="120" max="500" step="10" value="400" />
                </label>

                <label class="range-row" for="cloud-sun-iterations">
                  <span>太阳步进上限 <output id="cloud-sun-iterations-value">2</output></span>
                  <input id="cloud-sun-iterations" type="range" min="0" max="4" step="1" value="2" />
                </label>

                <label class="range-row" for="cloud-scattering">
                  <span>散射强度 <output id="cloud-scattering-value">1.00</output></span>
                  <input id="cloud-scattering" type="range" min="0.2" max="2" step="0.05" value="1" />
                </label>

                <label class="range-row" for="cloud-absorption">
                  <span>吸收强度 <output id="cloud-absorption-value">0.00</output></span>
                  <input id="cloud-absorption" type="range" min="0" max="0.5" step="0.01" value="0" />
                </label>

                <label class="range-row" for="cloud-turbulence">
                  <span>湍流位移 <output id="cloud-turbulence-value">350 m</output></span>
                  <input id="cloud-turbulence" type="range" min="0" max="1000" step="10" value="350" />
                </label>
              </section>

              <section class="control-section">
                <div class="section-head">
                  <span>大气与时间</span>
                </div>

                <label class="switch-row">
                  <span>大气散射</span>
                  <input type="checkbox" id="atmosphere-toggle" checked />
                  <span class="switch" aria-hidden="true"></span>
                </label>

                <label class="range-row" for="local-hour">
                  <span>北京时间 <output id="local-hour-value">15:30</output></span>
                  <input id="local-hour" type="range" min="0" max="1439" step="30" value="930" />
                </label>
              </section>

              <section class="control-section">
                <div class="section-head">
                  <span>水体</span>
                </div>

                <label class="switch-row">
                  <span>水面与模拟</span>
                  <input type="checkbox" id="water-toggle" checked />
                  <span class="switch" aria-hidden="true"></span>
                </label>
              </section>
            </div>
          </aside>

          <aside class="water-panel water-panel-right" id="water-right" aria-label="水体参数" hidden>
            <div class="panel-head">
              <span>水体参数</span>
              <span class="panel-head-side">
                <button
                  class="panel-collapse"
                  id="water-right-toggle"
                  type="button"
                  aria-expanded="true"
                  aria-controls="water-right-body"
                  aria-label="收起水体参数"
                >
                  <span class="chevron" aria-hidden="true"></span>
                </button>
              </span>
            </div>
            <div class="panel-body" id="water-right-body">
              <section class="control-section">
                <div class="section-head">
                  <span>模拟参数</span>
                </div>

                <label class="range-row" for="water-speed">
                  <span>模拟速度 <output id="water-speed-value">1.0×</output></span>
                  <input id="water-speed" type="range" min="0.1" max="64" step="0.1" value="1" />
                </label>

                <label class="range-row" for="water-amount">
                  <span>每次注水量 <output id="water-amount-value">15 m</output></span>
                  <input id="water-amount" type="range" min="1" max="300" step="1" value="15" />
                </label>

                <label class="range-row" for="water-inject-interval">
                  <span>注水间隔 <output id="water-inject-interval-value">0.033 s</output></span>
                  <input id="water-inject-interval" type="range" min="1" max="8" step="1" value="2" />
                </label>

                <label class="range-row" for="water-resolution">
                  <span>模拟精度 <output id="water-resolution-value">256²</output></span>
                  <input id="water-resolution" type="range" min="0" max="2" step="1" value="1" />
                </label>

                <label class="range-row" for="water-max-flow-speed">
                  <span>最大流速 <output id="water-max-flow-speed-value">30 m/s</output></span>
                  <input id="water-max-flow-speed" type="range" min="5" max="60" step="1" value="30" />
                </label>

                <label class="range-row" for="water-damping">
                  <span>流动阻尼 <output id="water-damping-value">0.995</output></span>
                  <input id="water-damping" type="range" min="0.9" max="1" step="0.005" value="0.995" />
                </label>

                <div class="water-button-row">
                  <button type="button" class="ghost-button" id="water-pause">暂停</button>
                  <button type="button" class="ghost-button" id="water-reset">重置模拟</button>
                </div>

                <p class="water-status-line" id="water-status">模拟域尚未建立</p>
              </section>

              <section class="control-section" id="water-source-editor" hidden>
                <div class="section-head">
                  <span>选中水源</span>
                </div>

                <label class="text-row" for="water-source-name">
                  <span>名称</span>
                  <input id="water-source-name" type="text" maxlength="40" autocomplete="off" />
                </label>

                <div class="text-row is-readonly">
                  <span>地面高程</span>
                  <output id="water-source-ground">—</output>
                </div>

                <label class="range-row" for="water-source-radius">
                  <span>水源半径 <output id="water-source-radius-value">150 m</output></span>
                  <input id="water-source-radius" type="range" min="20" max="2000" step="10" value="150" />
                </label>

                <label class="text-row" for="water-source-target">
                  <span>目标水面高程 <small>留空 = 不限制</small></span>
                  <input id="water-source-target" type="number" step="0.1" placeholder="不限制" />
                </label>

                <label class="switch-row">
                  <span>启用该水源</span>
                  <input type="checkbox" id="water-source-enabled" checked />
                  <span class="switch" aria-hidden="true"></span>
                </label>

                <button type="button" class="danger-button wide" id="water-source-delete">删除该水源</button>
              </section>

              <section class="control-section">
                <div class="section-head">
                  <span>光照</span>
                </div>

                <label class="range-row" for="water-shimmer">
                  <span>太阳高光 <output id="water-shimmer-value">1.00</output></span>
                  <input id="water-shimmer" type="range" min="0" max="3" step="0.05" value="1" />
                </label>

                <label class="range-row" for="water-glint">
                  <span>高光锐度 <output id="water-glint-value">1.00</output></span>
                  <input id="water-glint" type="range" min="0.3" max="2.5" step="0.05" value="1" />
                </label>

                <label class="range-row" for="water-reflection">
                  <span>天空反射 <output id="water-reflection-value">1.00</output></span>
                  <input id="water-reflection" type="range" min="0" max="1.5" step="0.05" value="1" />
                </label>

                <label class="range-row" for="water-clarity">
                  <span>水体清澈度 <output id="water-clarity-value">0.62</output></span>
                  <input id="water-clarity" type="range" min="0" max="1" step="0.01" value="0.62" />
                </label>

                <label class="range-row" for="water-opacity">
                  <span>水面不透明度 <output id="water-opacity-value">0.00</output></span>
                  <input id="water-opacity" type="range" min="0" max="1" step="0.01" value="0" />
                </label>
              </section>

              <section class="control-section">
                <div class="section-head">
                  <span>波纹与泡沫</span>
                </div>

                <label class="range-row" for="water-ripple">
                  <span>波纹强度 <output id="water-ripple-value">1.00</output></span>
                  <input id="water-ripple" type="range" min="0" max="2" step="0.05" value="1" />
                </label>

                <label class="range-row" for="water-ripple-scale">
                  <span>波纹尺度 <output id="water-ripple-scale-value">1.00</output></span>
                  <input id="water-ripple-scale" type="range" min="0.4" max="2.5" step="0.05" value="1" />
                </label>

                <label class="range-row" for="water-flow-speed">
                  <span>波纹流速 <output id="water-flow-speed-value">1.00</output></span>
                  <input id="water-flow-speed" type="range" min="0" max="2" step="0.05" value="1" />
                </label>

                <label class="range-row" for="water-foam">
                  <span>泡沫强度 <output id="water-foam-value">1.00</output></span>
                  <input id="water-foam" type="range" min="0" max="2" step="0.05" value="1" />
                </label>

                <button type="button" class="ghost-button wide" id="water-appearance-reset">恢复默认外观</button>
              </section>

              <section class="control-section">
                <div class="section-head">
                  <span>工程</span>
                </div>

                <div class="water-button-row is-grid">
                  <button type="button" class="ghost-button" id="water-save">保存</button>
                  <button type="button" class="ghost-button" id="water-export">导出 JSON</button>
                  <button type="button" class="ghost-button" id="water-import">导入 JSON</button>
                  <input type="file" id="water-import-file" accept="application/json,.json" hidden />
                </div>

                <p class="water-project-status" id="water-project-status" aria-live="polite"></p>
              </section>
            </div>
          </aside>
        </div>
      </main>

      <footer class="hud hud-bottom">
        <div class="coordinate-readout" aria-live="off">
          <span class="coord-item"><small>LON</small><b id="coord-lon">—</b></span>
          <span class="coord-item"><small>LAT</small><b id="coord-lat">—</b></span>
          <span class="coord-item"><small>ALT</small><b id="coord-alt">—</b></span>
        </div>
        <div class="credit-line">
          <span>TELLUX 0.3</span>
          <span class="divider"></span>
          <span>地形 © Cesium · 影像 © Cesium / ArcGIS</span>
          <span class="divider"></span>
          <span>渲染 © Tellux / Three.js</span>
        </div>
      </footer>
    </div>

    <button
      class="drawer-handle"
      id="source-drawer-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="water-left"
    >
      <span class="drawer-handle-glyph" aria-hidden="true"></span>
      <span class="drawer-handle-label">水源列表</span>
      <b class="drawer-handle-count" id="source-count">0</b>
    </button>

    <div class="water-labels" id="water-labels" aria-hidden="true" hidden></div>

    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="loader-orbit" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <div class="loader-copy">
        <strong>正在构建三维地球</strong>
        <small id="loader-detail">初始化渲染管线…</small>
      </div>
      <div class="loader-track"><span id="loader-bar"></span></div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
